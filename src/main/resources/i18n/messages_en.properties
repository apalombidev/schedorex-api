# Domain exceptions (Step 5/6) \u2014 one key per argument-less DomainException
error.service.not_found=No service configured yet. Complete the initial setup before proceeding.
error.slot.not_found=The requested slot does not exist.
error.slot.blocked=The requested slot is not available.
error.slot.already_booked=This slot has just been taken, please choose another one.
error.cancellation.deadline_passed=This booking can no longer be cancelled: the cancellation deadline has passed.
error.cancellation.invalid_token=Invalid cancellation link.
error.booking.not_found=Booking not found.
error.credentials.invalid=Invalid credentials.
error.availability.end_before_start=The end date cannot be before the start date.
error.availability.opening_not_before_closing=Opening time must be before closing time.
error.availability.lunch_break_invalid=The lunch break start must be before its end.
error.availability.lunch_break_outside_hours=The lunch break must fall within opening hours.

# GlobalExceptionHandler \u2014 technical cases (invalid timezone/enum, malformed path variable, fallback)
error.param.invalid=Invalid parameter ''{0}''.
error.timezone.invalid=Invalid time zone: {0}
error.field.invalid_value=Invalid value for field ''{0}'': ''{1}''
error.request.malformed=Malformed or invalid request.
error.validation.failed=One or more fields are invalid.
error.internal=An unexpected error occurred. Please try again later.

# Bean Validation (Step 4) \u2014 generic key per constraint type, reused across all DTOs.
# The field name that failed is already available separately in
# ErrorResponse.fieldErrors, so only the constraint needs describing here.
validation.notblank=This field cannot be blank.
validation.notnull=This field is required.
validation.positive=The value must be positive.
validation.size=Maximum allowed length is {max} characters.
validation.email=The email address is not valid.
validation.notempty=Must contain at least one item.