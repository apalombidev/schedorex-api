spring:
  application:
    name: scheduling-engine
 
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduling_engine}
    username: ${DB_USER:scheduling_user}
    password: ${DB_PASSWORD:changeme_local_only}
    driver-class-name: org.postgresql.Driver
 
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
 
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false